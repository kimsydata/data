<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바로가기 링크 실습</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    nav a { display: inline-block; margin-right: 10px; padding: 8px 12px; background: #e5e7eb; border-radius: 8px; text-decoration: none; color: #111827; }
    section { margin-top: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>HTML 바로가기 실습</h1>

  <nav>
    <a href="#html">HTML</a>
    <a href="#css">CSS</a>
    <a href="#javascript">JavaScript</a>
    <a href="mailto:test@example.com">메일 보내기</a>
  </nav>

  <section id="html">
    <h2>HTML</h2>
    <p>웹페이지의 구조를 만드는 언어입니다.</p>
  </section>

  <section id="css">
    <h2>CSS</h2>
    <p>웹페이지의 색상, 배치, 글꼴 등 디자인을 담당합니다.</p>
  </section>

  <section id="javascript">
    <h2>JavaScript</h2>
    <p>버튼 클릭, 입력값 처리 등 동작을 담당합니다.</p>
  </section>
</body>
</html>
