<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 여행지 Main Hub</title>
</head>
<body>
  <header>
    <h1>나의 여행지 Hub</h1>
    <p>HTML Semantics 실습: header, nav, main, section, article, footer 사용</p>
  </header>

  <nav>
    <a href="#seoul">서울</a> |
    <a href="#jeju">제주</a> |
    <a href="#busan">부산</a>
  </nav>

  <main>
    <section id="seoul">
      <h2>서울</h2>
      <article>
        <h3>경복궁</h3>
        <p>한국의 전통 건축과 역사를 볼 수 있는 대표 여행지입니다.</p>
        <img src="https://picsum.photos/seed/seoul/500/250" alt="서울 여행 이미지" />
      </article>
    </section>

    <section id="jeju">
      <h2>제주</h2>
      <article>
        <h3>성산일출봉</h3>
        <p>멋진 자연 경관을 감상할 수 있는 제주 대표 명소입니다.</p>
        <img src="https://picsum.photos/seed/jeju/500/250" alt="제주 여행 이미지" />
      </article>
    </section>

    <section id="busan">
      <h2>부산</h2>
      <article>
        <h3>해운대</h3>
        <p>바다와 도시 분위기를 함께 즐길 수 있는 곳입니다.</p>
        <img src="https://picsum.photos/seed/busan/500/250" alt="부산 여행 이미지" />
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Travel Hub</p>
  </footer>
</body>
</html>
