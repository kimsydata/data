<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Styling 실습</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>CSS Styling Practice</h1>
    <p>선택자, 박스 모델, Flexbox, Grid, 반응형, 애니메이션 실습</p>
    <a class="button" href="#cards">시작하기</a>
  </header>

  <main>
    <section class="box-model">
      <h2>Box Model</h2>
      <p>콘텐츠, padding, border, margin의 차이를 눈으로 확인합니다.</p>
    </section>

    <section id="cards" class="card-section">
      <h2>Flexbox Cards</h2>
      <div class="card-container">
        <article class="card">
          <h3>HTML</h3>
          <p>문서의 구조를 만듭니다.</p>
        </article>
        <article class="card important">
          <h3>CSS</h3>
          <p>문서의 디자인을 만듭니다.</p>
        </article>
        <article class="card">
          <h3>JavaScript</h3>
          <p>문서에 동작을 추가합니다.</p>
        </article>
      </div>
    </section>

    <section class="grid-section">
      <h2>Grid Layout</h2>
      <div class="grid">
        <div>Header</div>
        <div>Menu</div>
        <div>Main</div>
        <div>Footer</div>
      </div>
    </section>

    <section class="animation-section">
      <h2>Animation</h2>
      <div class="circle">CSS</div>
    </section>
  </main>
</body>
</html>
