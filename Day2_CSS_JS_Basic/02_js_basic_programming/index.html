<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript 기초 실습</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    button { padding: 10px 14px; margin: 6px; cursor: pointer; }
    pre { background: #111827; color: #e5e7eb; padding: 16px; border-radius: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>JavaScript 기초 프로그래밍</h1>
  <p>버튼을 눌러 변수, 조건문, 반복문, 함수, 배열, 객체를 확인합니다.</p>

  <button onclick="runVariables()">변수/자료형</button>
  <button onclick="runOperators()">연산자</button>
  <button onclick="runCondition()">조건문</button>
  <button onclick="runLoop()">반복문</button>
  <button onclick="runFunctionArrayObject()">함수/배열/객체</button>

  <pre id="output">실행 결과가 여기에 표시됩니다.</pre>

  <script src="script.js"></script>
</body>
</html>
